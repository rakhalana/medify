name: Medify CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: medify_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_pgsql, pgsql, gd, fileinfo, zip
        coverage: none

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Copy .env
      run: cp .env.example .env

    - name: Install Composer Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Composer Audit
      run: composer audit --locked

    - name: Run Pint Code Style Check
      run: vendor/bin/pint --test

    - name: Run Larastan Static Analysis
      run: vendor/bin/phpstan analyse --no-progress

    - name: Install NPM Dependencies & Build Assets
      run: |
        npm ci
        npm audit --audit-level=high
        npm run build

    - name: Generate App Key
      run: php artisan key:generate

    - name: Run Migrations
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: medify_test
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: php artisan migrate --force

    - name: Execute Tests
      env:
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        DB_DATABASE: medify_test
        DB_USERNAME: postgres
        DB_PASSWORD: password
      run: vendor/bin/phpunit
